<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, this is nikesh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f7f8ff;
        font-family: Outfit, system-ui, sans-serif;
        background: #080a18;
      }
      .orb { position: fixed; border-radius: 50%; filter: blur(1px); opacity: .75; }
      .orb.one { width: 34rem; height: 34rem; top: -16rem; left: -11rem; background: #6d42ff; }
      .orb.two { width: 30rem; height: 30rem; right: -12rem; bottom: -13rem; background: #00b7d8; }
      main {
        position: relative;
        width: min(90vw, 760px);
        padding: clamp(2rem, 7vw, 5rem);
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.055));
        box-shadow: 0 28px 80px rgba(0,0,0,.38);
        backdrop-filter: blur(18px);
      }
      nav { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 3.3rem; }
      nav a { padding: .5rem .75rem; border-radius: 999px; color: #d7d9ed; font: .78rem "DM Mono", monospace; text-decoration: none; transition: background .2s, color .2s; }
      nav a:hover, nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.14); }
      .eyebrow { margin: 0 0 1.3rem; color: #a9eaff; font: 500 .78rem/1 "DM Mono", monospace; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(3.6rem, 11vw, 7rem); line-height: .88; letter-spacing: -.075em; }
      h1 span { color: #a99aff; }
      p { max-width: 38rem; margin: 2rem 0 0; color: #d7d9ed; font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.65; }
      .footer { display: flex; align-items: center; gap: .7rem; margin-top: 3.2rem; color: #9da1c5; font: .82rem "DM Mono", monospace; }
      .spark { width: .65rem; height: .65rem; border-radius: 50%; background: #84f6bd; box-shadow: 0 0 18px #84f6bd; }
      @media (max-width: 520px) { main { border-radius: 22px; } }
    </style>
  </head>
  <body>
    <div class="orb one"></div><div class="orb two"></div>
    <main>
      <nav aria-label="Primary navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="feedback.html">Feedback</a>
      </nav>
      <p class="eyebrow">A bright beginning</p>
      <h1>Hello,<br /><span>world.</span></h1>
      <p>This is your first beautiful page—simple, expressive, and ready for whatever you build next.</p>
      <div class="footer"><span class="spark"></span> Ready to create something great</div>
    </main>
  </body>
</html>
