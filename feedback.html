    <style>
      :root { color-scheme: dark; } * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f7f8ff; font-family: Outfit, system-ui, sans-serif; background: #080a18; padding: 2rem; } .orb { position: fixed; border-radius: 50%; opacity: .75; } .one { width: 34rem; height: 34rem; top: -16rem; left: -11rem; background: #6d42ff; } .two { width: 30rem; height: 30rem; right: -12rem; bottom: -13rem; background: #00b7d8; } main { position: relative; width: min(90vw, 760px); padding: clamp(2rem, 7vw, 5rem); border: 1px solid rgba(255,255,255,.18); border-radius: 28px; background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.055)); box-shadow: 0 28px 80px rgba(0,0,0,.38); backdrop-filter: blur(18px); } nav { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 3.3rem; } nav a { padding: .5rem .75rem; border-radius: 999px; color: #d7d9ed; font: .78rem "DM Mono", monospace; text-decoration: none; } nav a:hover, nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.14); } .eyebrow { margin: 0 0 1.3rem; color: #a9eaff; font: 500 .78rem/1 "DM Mono", monospace; letter-spacing: .14em; text-transform: uppercase; } h1 { margin: 0; font-size: clamp(3rem, 8vw, 5.5rem); line-height: .94; letter-spacing: -.065em; } h1 span { color: #a99aff; } p { max-width: 38rem; margin: 1.5rem 0 0; color: #d7d9ed; font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.65; } form { display: grid; gap: .9rem; margin-top: 1.7rem; } label { color: #d7d9ed; font-size: .9rem; } input, textarea { width: 100%; padding: .8rem .9rem; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; color: #fff; background: rgba(8,10,24,.45); font: inherit; } textarea { min-height: 7rem; resize: vertical; } button { justify-self: start; padding: .85rem 1.15rem; border: 0; border-radius: 12px; cursor: pointer; color: #08101b; background: #a9eaff; font: 700 1rem Outfit, sans-serif; }
    </style>
  </head>
  <body><div class="orb one"></div><div class="orb two"></div><main>
    <nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="feedback.html" aria-current="page">Feedback</a></nav>
